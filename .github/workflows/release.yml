name: Release

on:
  push:
    tags:
    - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  build-linux-x86_64:
    name: Create and upload release tarballs
    if: github.event.base_ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Nix
      uses: cachix/install-nix-action@v27

    - name: Prepare metadata
      id: metadata
      run: |
        echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        echo "TARBALL=futhark-${GITHUB_REF#refs/tags/v}-linux-x86_64.tar.xz" >> $GITHUB_OUTPUT

    - name: Build tarball
      env:
        VERSION: ${{ steps.metadata.outputs.VERSION }}
      run: nix build .#tarball

    - name: Extract release changes
      env:
        VERSION: ${{ steps.metadata.outputs.VERSION }}
      run:
        sh tools/changelog.sh $VERSION < CHANGELOG.md > release_changes.md

    - name: Create release and upload tarball
      uses: softprops/action-gh-release@v3.0.3
      with:
        name: ${{ steps.metadata.outputs.VERSION }}
        body_path: release_changes.md
        draft: false
        prerelease: false
        files: result/${{ steps.metadata.outputs.TARBALL }}

    - name: Install SSH key
      uses: shimataro/ssh-key-action@v2
      with:
        key: ${{ secrets.SSHKEY }}
        known_hosts: ${{ secrets.KNOWN_HOSTS }}

    - name: scp to server
      env:
        TARBALL: ${{ steps.metadata.outputs.TARBALL }}
      run: scp -o StrictHostKeyChecking=no result/$TARBALL futhark@futhark-lang.org:/var/www/htdocs/futhark-lang.org/releases

  build-linux-aarch64:
    name: Build Linux Aarch64 release tarball
    if: github.event.base_ref == 'refs/heads/master'
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v7
    - name: Install Nix
      uses: cachix/install-nix-action@v27
    - name: Prepare metadata
      id: metadata
      run: |
        echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
    - name: Build tarball
      run: nix build .#tarball
    - uses: ./.github/actions/check-linux-aarch64-tarball
      with:
        tarball: result/futhark-${{ steps.metadata.outputs.VERSION }}-linux-aarch64.tar.xz
        directory: futhark-${{ steps.metadata.outputs.VERSION }}-linux-aarch64
    - uses: actions/upload-artifact@v5
      with:
        name: futhark-linux-aarch64-release
        path: result/futhark-${{ steps.metadata.outputs.VERSION }}-linux-aarch64.tar.xz
        if-no-files-found: error

  publish-linux-aarch64:
    name: Publish Linux Aarch64 release tarball
    needs: [build-linux-x86_64, build-linux-aarch64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: futhark-linux-aarch64-release
    - name: Install SSH key
      uses: shimataro/ssh-key-action@v2
      with:
        key: ${{ secrets.SSHKEY }}
        known_hosts: ${{ secrets.KNOWN_HOSTS }}
    - name: Publish tarball
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        tarball="futhark-${GITHUB_REF#refs/tags/v}-linux-aarch64.tar.xz"
        scp -o StrictHostKeyChecking=no "$tarball" futhark@futhark-lang.org:/var/www/htdocs/futhark-lang.org/releases
        gh release upload "$GITHUB_REF_NAME" "$tarball" --clobber

  upload-to-hackage:
    name: Upload to Hackage
    if: github.event.base_ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install Nix
      uses: cachix/install-nix-action@v27

    # - uses: cachix/cachix-action@v12
    #   with:
    #     name: futhark
    #     signingKey: '${{ secrets.CACHIX_SIGNING_KEY }}'

    - name: Upload to Hackage
      run: |
        export HACKAGE_KEY
        export VERSION
        nix develop --command cabal update
        nix develop --command tools/release/hackage.sh
      env:
        HACKAGE_KEY: ${{ secrets.HACKAGE_KEY }}
        VERSION: ${{ steps.metadata.outputs.VERSION }}
