name: 'Compare Benchmark'
description: 'Run futhark bench with master and PR compilers and compare results'
inputs:
  backend:
    description: 'Backend to use'
    required: true
  system:
    description: 'Name of system (e.g. GPU name)'
    required: true
  slurm-options:
    description: 'Options to pass to srun'
    required: false
    default: ''
  wrapper:
    description: 'Command prefix for running the benchmarks (e.g. numactl)'
    required: false
    default: ''
  exclude:
    description: 'Comma-separated list of nodes that srun must not use'
    required: false
    default: 'hendrixgpu04fl'
runs:
  using: "composite"
  steps:
    - name: Ensure script is executable
      run: chmod +x .github/actions/cmp-benchmark/cmp-benchmark.sh
      shell: bash
    - uses: ./.github/actions/futhark-slurm
      with:
        script: ${{inputs.wrapper}} .github/actions/cmp-benchmark/cmp-benchmark.sh ${{inputs.backend}} ${{inputs.system}}
        slurm-options: ${{inputs.slurm-options}}
        exclude: ${{inputs.exclude}}
